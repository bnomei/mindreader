name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt-and-packaging:
    name: Formatting and packaging contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check release scripts
        run: |
          bash -n scripts/*.sh
          bash scripts/test-release-workflow.sh
          sh scripts/test-install.sh
          scripts/resolve-version.sh
          cmp LICENSE npm/mindreader/LICENSE
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test npm wrapper
        working-directory: npm/mindreader
        run: |
          npm test
          npm pack --dry-run

  clippy:
    name: Clippy
    needs: [fmt-and-packaging]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  msrv:
    name: Rust 1.89 compatibility
    needs: [fmt-and-packaging]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.89-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
      - name: Check minimum supported Rust version
        run: cargo check --locked --all-targets --all-features

  test:
    name: Tests
    needs: [fmt-and-packaging]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Run tests
        run: cargo test --locked --all-targets --all-features
      - name: Run documentation tests
        run: cargo test --locked --doc
      - name: Verify Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Verify publishable package
        run: cargo package --locked -p mindreader
      - name: Build release binary
        run: cargo build --locked --release --bin mindreader
      - name: Smoke offline CLI
        run: |
          target/release/mindreader --version
          target/release/mindreader --help
