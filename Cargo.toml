[package]
name = "mindreader"
version = "0.1.0"
edition = "2021"
description = "Neo4j RDFS schema-as-data memory MCP server"
homepage = "https://github.com/bnomei/mindreader"
repository = "https://github.com/bnomei/mindreader"
license = "MIT"
readme = "README.md"
rust-version = "1.89"
publish = false

[lib]
name = "mindreader"
path = "src/lib.rs"

[[bin]]
name = "mindreader"
path = "src/main.rs"

[[bin]]
name = "mindreader-smoke"
path = "src/bin/mindreader-smoke.rs"

[dependencies]
async-trait = "0.1.92"
directories = "6.0.0"
dotenvy = "0.15.7"
neo4rs = "0.8.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.1.2", default-features = false, features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.4"
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
