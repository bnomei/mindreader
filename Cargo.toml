[package]
name = "mindreader"
version = "0.5.0"
edition = "2021"
autobins = false
authors = ["Bruno Meilick"]
categories = ["command-line-utilities", "development-tools"]
description = "Neo4j RDFS schema-as-data memory MCP server"
documentation = "https://docs.rs/mindreader"
homepage = "https://github.com/bnomei/mindreader"
include = [
  "/src/**",
  "/benches/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/mcp.json",
  "/scripts/mcp_handshake_probe.py",
  "/skills/using-mindreader/**",
]
keywords = ["mcp", "neo4j", "knowledge-graph", "memory", "semantic-search"]
repository = "https://github.com/bnomei/mindreader"
license = "MIT"
readme = "README.md"
rust-version = "1.89"
publish = ["crates-io"]

[features]
developer-tools = []

[lib]
name = "mindreader"
path = "src/lib.rs"

[[bin]]
name = "mindreader"
path = "src/main.rs"

[[bin]]
name = "mindreader-smoke"
path = "src/bin/mindreader-smoke.rs"
required-features = ["developer-tools"]

[[bin]]
name = "mindreader-bench"
path = "src/bin/mindreader-bench.rs"
required-features = ["developer-tools"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/mindreader-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/mindreader-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
async-trait = "0.1.92"
directories = "6.0.0"
dotenvy = "0.15.7"
httpdate = "1.0.3"
neo4rs = "=0.9.0-rc.10"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.1.2", default-features = false, features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.4"
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
divan = "0.1.21"
tempfile = "3.27.0"

[[bench]]
name = "cpu_hotspots"
harness = false
