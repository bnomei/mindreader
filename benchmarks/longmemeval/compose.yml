services:
  neo4j:
    image: neo4j:5.26-community
    container_name: mindreader-neo4j-longmemeval
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set a benchmark-only NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "apoc-extended"]'
      NEO4J_apoc_ttl_enabled: "true"
      NEO4J_dbms_security_procedures_allowlist: "apoc.config.list,apoc.merge.node,apoc.text.*,apoc.refactor.mergeNodes,apoc.ttl.*"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.config.list,apoc.refactor.mergeNodes,apoc.ttl.*"
    ports:
      - "7476:7474"
      - "7689:7687"
    volumes:
      - neo4j-longmemeval-data:/data

volumes:
  neo4j-longmemeval-data:
