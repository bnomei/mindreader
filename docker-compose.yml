services:
  neo4j:
    image: neo4j:5.26-community
    container_name: mindreader-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
      NEO4J_PLUGINS: '["apoc", "apoc-extended"]'
      NEO4J_apoc_ttl_enabled: "true"
      NEO4J_dbms_security_procedures_allowlist: "apoc.config.list,apoc.text.*,apoc.refactor.mergeNodes,apoc.ttl.*"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.config.list,apoc.refactor.mergeNodes,apoc.ttl.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  mindreader:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    depends_on:
      - neo4j
    profiles: ["mindreader"]
    stdin_open: true
    tty: true

volumes:
  neo4j-data:
