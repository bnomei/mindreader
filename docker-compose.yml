services:
  neo4j:
    image: neo4j:5.26-community
    container_name: mindreader-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  mindreader:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
    depends_on:
      - neo4j
    profiles: ["mindreader"]
    stdin_open: true
    tty: true

volumes:
  neo4j-data:
